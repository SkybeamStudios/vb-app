name: "Vibastic Builds"
run-name: "Vibastic ${{ github.event.inputs.client_build_id }}"
on:
  workflow_dispatch:
    inputs:
      client_build_id: { required: true, type: string }
      retry_count: { required: false, type: string, default: "0" }
      runner_token: { required: false, type: string, default: "" }
      vibastic_origin: { required: false, type: string, default: "" }
permissions: { contents: read }
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install app icon (official Vibastic icon for dock/taskbar/installer)
        run: bash install-electron-icon.sh
      - name: Build DMG (electron-builder)
        working-directory: electron
        run: |
          npm install
          npx electron-builder --mac dmg --publish never
      - uses: actions/upload-artifact@v4
        with: { name: macos-dmg, retention-days: 7, path: "electron/dist/*.dmg" }
