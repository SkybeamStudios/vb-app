name: "Vibastic Builds"
run-name: "Vibastic ${{ github.event.inputs.client_build_id }}"
on:
  workflow_dispatch:
    inputs:
      client_build_id: { required: true, type: string }
      retry_count: { required: false, type: string, default: "0" }
permissions: { contents: read }
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install app icon (official Vibastic icon for taskbar/installer)
        run: bash install-electron-icon.sh
      - name: Build EXE/MSI (NSIS + MSI)
        working-directory: electron
        run: |
          npm install
          npx electron-builder --win nsis msi --publish never
      - uses: actions/upload-artifact@v4
        with: { name: windows-exe, retention-days: 7, path: "electron/dist/*.+(exe|msi)" }
