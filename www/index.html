<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Vibastic Windows 11 App</title>
<style>
  body { margin:0; font-family:system-ui, sans-serif; background:linear-gradient(135deg,#1e293b,#0f172a); color:#e2e8f0; height:100vh; display:flex; align-items:center; justify-content:center; }
  button { background:#3b82f6; color:#fff; border:none; padding:1rem 2rem; border-radius:0.5rem; font-size:1.2rem; cursor:pointer; transition:background .2s; }
  button:hover { background:#2563eb; }
</style>
</head>
<body>
<button id="actionBtn">Cliquez-moi</button>
<script>
  document.getElementById('actionBtn').addEventListener('click', () => {
    alert('Bonjour depuis votre application Windows 11 !');
  });
</script>
</body>
</html>
